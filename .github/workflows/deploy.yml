name: Deploy Frontend to rumahweb

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Upload build via SCP
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.RUMAHWEB_SSH_HOST }}
          port: ${{ secrets.RUMAHWEB_SSH_PORT }}
          username: ${{ secrets.RUMAHWEB_SSH_USER }}
          key: ${{ secrets.RUMAHWEB_SSH_KEY }}
          source: "dist/,server.js,package.json,package-lock.json"
          target: ${{ secrets.RUMAHWEB_FE_PATH }}

      - name: Install deps, restart app
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.RUMAHWEB_SSH_HOST }}
          port: ${{ secrets.RUMAHWEB_SSH_PORT }}
          username: ${{ secrets.RUMAHWEB_SSH_USER }}
          key: ${{ secrets.RUMAHWEB_SSH_KEY }}
          script: |
            set -e
            # Activates the Node.js Selector virtualenv cPanel created for this app.
            source ${{ secrets.RUMAHWEB_NODEVENV_PATH_FE }}/bin/activate
            cd ${{ secrets.RUMAHWEB_FE_PATH }}
            npm ci --omit=dev
            mkdir -p tmp && touch tmp/restart.txt
