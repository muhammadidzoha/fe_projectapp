name: Deploy Frontend to rumahweb

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Replace node_modules with server.js's actual runtime deps
        run: |
          # server.js only ever imports express and http-proxy-middleware -
          # everything else in package.json's dependencies (React, Tailwind,
          # Tiptap, recharts, etc.) is build-time only and already baked into
          # dist/*.js. Uploading the full tree made the SCP step transfer
          # tens of thousands of unnecessary files and made it more exposed
          # to this host's flaky-connection history. Install a minimal
          # node_modules in isolation instead, leaving the real package.json
          # (needed on the server for its "type": "module" field) untouched.
          rm -rf node_modules
          mkdir -p /tmp/server-deps
          cp package.json /tmp/server-deps/
          node -e "
            const fs = require('fs');
            const path = '/tmp/server-deps/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.dependencies = {
              express: pkg.dependencies.express,
              'http-proxy-middleware': pkg.dependencies['http-proxy-middleware'],
            };
            delete pkg.devDependencies;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2));
          "
          cd /tmp/server-deps
          npm install --omit=dev
          cp -r node_modules "$GITHUB_WORKSPACE/node_modules"

      - name: Stage deploy artifact
        run: |
          set -e
          rm -rf .deploy
          mkdir -p .deploy
          cp -r dist server.js package.json package-lock.json node_modules .deploy/
          mkdir -p .deploy/tmp
          date > .deploy/tmp/restart.txt
          # node_modules is built and pruned to production dependencies
          # entirely on the GitHub Actions runner and uploaded as-is - npm
          # install/ci is never run on the server itself, since this
          # shared-hosting account's resource limits can't sustain it (the
          # same crash - exit 134/SIGABRT - that the backend deploy hit
          # before it switched to this same pattern).
          #
          # rumahweb support confirmed SSH/SCP from GitHub Actions is not
          # reliably supported on this shared-hosting account, and directed
          # us to FTP instead - hence this step's deploy transport (same
          # switch made on the backend deploy pipeline).
          # tmp/restart.txt is included in the upload itself (rather than a
          # separate SSH-triggered touch) since Passenger only needs its
          # mtime bumped, which a fresh upload already does.

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.RUMAHWEB_FTP_HOST }}
          username: ${{ secrets.RUMAHWEB_FTP_USER }}
          password: ${{ secrets.RUMAHWEB_FTP_PASSWORD }}
          port: ${{ secrets.RUMAHWEB_FTP_PORT }}
          server-dir: ${{ secrets.RUMAHWEB_FE_PATH }}/
          local-dir: ./.deploy/
          protocol: ftps
